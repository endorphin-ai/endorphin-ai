name: CI

on:
  push:
    branches: [develop]
    paths: ['code/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['code/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run type-check
      - run: npm run test:unit
